[package]
name = "silk-mp4"
version = "0.14.0-silk.1"
authors = ["Alf <alf.g.jr@gmail.com>", "Silk Project Contributors"]
edition = "2018"
description = "Silk-maintained fork of the mp4 reader and writer library."
homepage = "https://github.com/alfg/mp4-rust"
repository = "https://github.com/alfg/mp4-rust"
readme = "README.md"
keywords = ["mp4", "iso-mp4", "isobmff", "video", "multimedia"]
license = "MIT"
publish = false

[lib]
name = "mp4"
path = "src/lib.rs"

[dependencies]
thiserror = "^1.0"
byteorder = "1"
bytes = "1.1.0"
num-rational = { version = "0.4.0", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
criterion = "0.3"

[[bench]]
name = "bench_main"
harness = false
